services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth_dev_password}
      POSTGRES_DB: auth
    ports:
      # Bound to localhost only: the database must not be reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Start with: docker compose --profile app up --build
  api:
    profiles: ["app"]
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://auth:${POSTGRES_PASSWORD:-auth_dev_password}@db:5432/auth?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (at least 32 characters)}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
